DATASET: 'CustomRadarDataset'
DATA_PATH: '../data/custom_radar_front_ars548'

POINT_CLOUD_RANGE: [0.0, -60.0, -4.0, 140.0, 60.0, 4.0]

DATA_SPLIT: {
  'train': train,
  'test': val
}

INFO_PATH: {
  'train': [custom_radar_infos_train.pkl],
  'test': [custom_radar_infos_val.pkl]
}

POINT_FEATURE_ENCODING: {
  encoding_type: absolute_coordinates_encoding,
  src_feature_list: ['x', 'y', 'z', 'rcs', 'radial_velocity', 'snr', 'rss', 'existence_prob', 'time_delta'],
  used_feature_list: ['x', 'y', 'z', 'rcs', 'radial_velocity', 'snr', 'rss', 'existence_prob', 'time_delta'],
}

FEATURE_NORMALIZATION:
  rcs: {clip: [-50.0, 50.0], mean: 0.0, std: 25.0}
  radial_velocity: {clip: [-80.0, 80.0], mean: 0.0, std: 30.0}
  snr: {clip: [0.0, 64.0], mean: 16.0, std: 16.0}
  rss: {clip: [-180.0, 0.0], mean: -90.0, std: 45.0}
  existence_prob: {clip: [0.0, 255.0], mean: 128.0, std: 128.0}

DATA_AUGMENTOR:
  DISABLE_AUG_LIST: ['placeholder']
  AUG_CONFIG_LIST:
    - NAME: random_world_flip
      ALONG_AXIS_LIST: ['y']

    - NAME: random_world_rotation
      WORLD_ROT_ANGLE: [-0.3925, 0.3925]

    - NAME: random_world_scaling
      WORLD_SCALE_RANGE: [0.95, 1.05]

DATA_PROCESSOR:
  - NAME: mask_points_and_boxes_outside_range
    REMOVE_OUTSIDE_BOXES: True

  - NAME: shuffle_points
    SHUFFLE_ENABLED: {
      'train': True,
      'test': False
    }

  - NAME: transform_points_to_voxels
    VOXEL_SIZE: [0.25, 0.25, 0.20]
    MAX_POINTS_PER_VOXEL: 10
    MAX_NUMBER_OF_VOXELS: {
      'train': 40000,
      'test': 40000
    }
