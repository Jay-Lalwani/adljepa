CLASS_NAMES: ['Car']

DATA_CONFIG:
  _BASE_CONFIG_: cfgs/dataset_configs/custom_radar_front_ars548.yaml
  ALLOW_EMPTY_GT: True
  DATA_AUGMENTOR:
    DISABLE_AUG_LIST: []
    AUG_CONFIG_LIST: []

MODEL:
  NAME: AD_L_JEPA

  VFE:
    NAME: MeanVFE

  BACKBONE_3D:
    NAME: AD_L_JEPA
    RETURN_ENCODED_TENSOR: True
    MASKED_RATIO: 0.5
    ALPHA: 1.0
    BETA: 10.0

OPTIMIZATION:
  BATCH_SIZE_PER_GPU: 4
  NUM_EPOCHS: 30

  OPTIMIZER: adam_onecycle
  LR: 0.0003
  WEIGHT_DECAY: 0.01
  MOMENTUM: 0.9

  MOMS: [0.95, 0.85]
  PCT_START: 0.4
  DIV_FACTOR: 10
  DECAY_STEP_LIST: [35, 45]
  LR_DECAY: 0.1
  LR_CLIP: 0.0000001

  LR_WARMUP: False
  WARMUP_EPOCH: 1
  GRAD_NORM_CLIP: 10

  EMA: [0.996, 1.0]
